services:

  postgres:
    image: postgres:16
    container_name: tcc_postgres
    restart: always
    environment:
      POSTGRES_DB: customersdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./Database:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  customerservice:
    build:
      context: ./CustomerService   # ✅ corrigido
      dockerfile: Dockerfile
    container_name: customer_service
    ports:
      - "5001:8080"
    depends_on:
      - postgres
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=customersdb;Username=postgres;Password=postgres  

  productservice:
    build:
      context: ./ProductService
      dockerfile: Dockerfile
    container_name: product_service
    ports:
      - "5002:8080"
    depends_on:
      - postgres
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=customersdb;Username=postgres;Password=postgres

volumes:
  postgres_data: